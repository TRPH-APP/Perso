<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murph</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Murph">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17383B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#F3F1E8; --card:#FFFFFF; --ink:#1B2B2D; --soft:#5D6B6C; --line:#DAD8CC;
  --teal:#17383B; --turq:#2A9D9A; --saddle:#8C5A2E; --warn:#B4492C;
  --num-bg:#FFFFFF; --num-ink:#17383B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#0F1E20; --card:#172B2E; --ink:#ECEFE6; --soft:#9DB0AE; --line:#29413F;
    --teal:#0B1A1C; --turq:#4CC3BF; --saddle:#D19A63; --warn:#E5785B;
    --num-bg:#ECEFE6; --num-ink:#0F1E20; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font:16px/1.5 Figtree,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal)}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:0 18px 110px}
.top{background:var(--teal);color:#F3F1E8;padding:18px 18px 64px}
.top .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline}
.top h1{font-size:1.35rem}
.top small{opacity:.75}

/* Le dossard : élément signature */
.bib{position:relative;margin:-48px auto 0;background:var(--num-bg);color:var(--num-ink);
  border-radius:10px;padding:22px 22px 20px;box-shadow:0 14px 30px -18px rgba(10,30,32,.55)}
.bib::before,.bib::after{content:"";position:absolute;top:14px;width:12px;height:12px;border-radius:50%;
  background:var(--paper);box-shadow:inset 0 0 0 2px var(--turq)}
.bib::before{left:14px}.bib::after{right:14px}
.bib .when{font-size:.9rem;color:var(--soft);text-align:center;margin:0}
.bib .num{font-family:"Young Serif",Georgia,serif;font-size:clamp(4.5rem,24vw,7.5rem);line-height:1;text-align:center;
  letter-spacing:-.02em;margin:6px 0 2px}
.bib .unit{text-align:center;font-weight:600;margin:0 0 14px}
.bib h2{font-size:1.5rem;text-align:center;line-height:1.2}
.bib .where{text-align:center;color:var(--soft);margin:6px 0 0}
.bib .shows{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem;color:var(--ink);background:transparent}
.chip.on{border-color:var(--turq);color:var(--turq)}
.chip.warn{border-color:var(--warn);color:var(--warn)}

section{margin-top:30px}
section > h3{font-size:1.15rem;margin-bottom:10px}
.horse{border-left:3px solid var(--saddle);padding:2px 0 2px 14px;margin:0 0 18px}
.horse h4{margin:0 0 4px;font-size:1.05rem}
.horse h4 span{font-weight:400;color:var(--soft);font-size:.9rem}
.day{display:grid;grid-template-columns:5.6rem 1fr;gap:2px 10px;margin:6px 0}
.day dt{color:var(--soft);font-size:.9rem}
.day dd{margin:0}
.day dd div{margin-bottom:2px}
.day b{font-variant-numeric:tabular-nums}
.muted{color:var(--soft);font-size:.92rem}
.next{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.next:last-child{border-bottom:1px solid var(--line)}
.next .d{color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}

.show{background:var(--card);border-radius:8px;margin-bottom:12px;border:1px solid var(--line)}
.show > button{all:unset;display:block;width:100%;padding:14px 16px;cursor:pointer;box-sizing:border-box}
.show > button:focus-visible{outline:3px solid var(--turq);border-radius:8px}
.show h3{font-size:1.1rem;line-height:1.25}
.show .meta{color:var(--soft);font-size:.9rem;margin-top:3px}
.show .body{padding:0 16px 14px}
.show[data-past] {opacity:.6}
.link{color:var(--turq);font-weight:600;text-decoration:none}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px;z-index:5}
nav a{flex:0 1 120px;text-align:center;padding:8px 4px;border-radius:8px;color:var(--soft);text-decoration:none;font-weight:600;font-size:.9rem}
nav a[aria-current=page]{color:var(--turq);background:color-mix(in srgb,var(--turq) 12%,transparent)}

.login{max-width:380px;margin:12vh auto 0;padding:0 22px}
.login h1{font-size:2rem;margin-bottom:6px}
.login label{display:block;font-weight:600;margin:18px 0 6px}
.login input{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn{display:inline-block;margin-top:14px;padding:12px 18px;border:0;border-radius:8px;background:var(--turq);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--soft);padding:12px 0;margin-left:14px}
.msg{min-height:1.5em;margin-top:12px;color:var(--warn)}
.empty{padding:24px 0;color:var(--soft)}

/* Étape 2 */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.btn.small{margin:0;padding:8px 14px;font-size:.92rem}
.btn.line{background:transparent;color:var(--turq);border:1px solid var(--turq)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink);text-decoration:none}
.row h3{font-size:1.08rem;line-height:1.25}
.row .meta{color:var(--soft);font-size:.9rem;margin-top:2px}
.back{display:inline-block;margin-top:16px;color:var(--turq);font-weight:600;text-decoration:none}
.tl-day{margin-top:18px}
.tl-day > h4{margin:0 0 8px;font-size:.95rem;color:var(--soft);font-weight:600}
.bk{display:grid;grid-template-columns:4.2rem 1fr;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.bk .k{font-size:.8rem;font-weight:700;color:var(--saddle);padding-top:2px}
.bk .t{font-weight:600}
.bk .s{color:var(--soft);font-size:.9rem}
.bk.todo{border-style:dashed;border-color:var(--warn)}
.bk.todo .k{color:var(--warn)}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:last-child{border-bottom:1px solid var(--line)}
.task input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--turq);flex:none}
.task .tx{flex:1;cursor:pointer}
.task .d{color:var(--soft);font-size:.88rem;white-space:nowrap}
.task .d.late{color:var(--warn);font-weight:600}
.task.done .tx{text-decoration:line-through;color:var(--soft)}
.flight{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.flight .route{font-family:"Young Serif",Georgia,serif;font-size:1.6rem;line-height:1.1}
.flight .s{color:var(--soft);font-size:.9rem}
.balance{text-align:center;padding:22px 16px;background:var(--num-bg);color:var(--num-ink);border-radius:10px;margin:-48px auto 0;box-shadow:0 14px 30px -18px rgba(10,30,32,.55)}
.balance .amt{font-family:"Young Serif",Georgia,serif;font-size:clamp(2.6rem,12vw,4rem);line-height:1.1;margin:4px 0}
.balance p{margin:0}
.ex{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.ex:last-child{border-bottom:1px solid var(--line)}
.ex .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex .s{color:var(--soft);font-size:.88rem}
.pos{color:var(--turq)} .neg{color:var(--warn)}
details summary{cursor:pointer;color:var(--soft);font-weight:600;margin:14px 0 6px}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(8,22,24,.55)}
dialog form{padding:18px 18px 16px;overflow:auto;max-height:90vh}
dialog h2{font-size:1.3rem;margin-bottom:6px}
.f{margin-top:12px}
.f label{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.f textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.actions .sp{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:8px;z-index:20;font-size:.95rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){ .bib{animation:drop .5s ease-out both} @keyframes drop{from{transform:translateY(-10px);opacity:0}} }
</style>
</head>
<body>

<div id="vLogin" class="login" hidden>
  <h1>Murph</h1>
  <p class="muted">Espace privé. Connexion par code reçu par e-mail, avec la même adresse que TRPH.</p>
  <label for="email">Adresse e-mail</label>
  <input id="email" type="email" autocomplete="email" value="dhondtmf@gmail.com">
  <div id="codeBox" hidden>
    <label for="code">Code reçu par e-mail</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
  </div>
  <button class="btn" id="bLogin">Recevoir le code</button>
  <p class="msg" id="loginMsg" role="status"></p>
</div>

<div id="vApp" hidden>
  <header class="top"><div class="in"><h1 id="title">Accueil</h1><small id="today"></small></div></header>
  <main id="main"></main>
  <nav>
    <a href="#accueil" data-v="accueil">Accueil</a>
    <a href="#concours" data-v="concours">Concours</a>
    <a href="#voyages" data-v="voyages">Voyages</a>
    <a href="#finances" data-v="finances">Finances</a>
    <a href="#coffre" data-v="coffre">Coffre</a>
  </nav>
  <dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script>
const SUPABASE_URL = "https://atcebetkiqisdgieodzr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OUmTm-auj3Wyx6TZBsxu3A_ke8EIVKE";
const TRPH_URL = "https://trph-app.github.io/Trph/";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let D = null; // données chargées

// ---------- Dates ----------
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const toDate = iso => new Date(iso + "T12:00:00");
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 864e5);
const fmt = (iso, o) => toDate(iso).toLocaleDateString("fr-BE", o);
const fmtDay = iso => fmt(iso, {weekday:"short", day:"numeric", month:"short"});
function fmtRange(a, b){
  if(!a) return "";
  if(!b || a === b) return fmt(a, {day:"numeric", month:"long", year:"numeric"});
  const A = toDate(a), B = toDate(b);
  if(A.getFullYear() === B.getFullYear()){
    if(A.getMonth() === B.getMonth()) return `${A.getDate()}–${fmt(b,{day:"numeric",month:"long",year:"numeric"})}`;
    return `${fmt(a,{day:"numeric",month:"short"})} – ${fmt(b,{day:"numeric",month:"short",year:"numeric"})}`;
  }
  return `${fmt(a,{day:"numeric",month:"short",year:"numeric"})} – ${fmt(b,{day:"numeric",month:"short",year:"numeric"})}`;
}

// ---------- Connexion ----------
let codeSent = false;
$("#bLogin").onclick = async () => {
  const email = $("#email").value.trim().toLowerCase(), m = $("#loginMsg");
  m.textContent = "";
  if(!codeSent){
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:false } });
    if(error){ m.textContent = "Envoi impossible : " + error.message; return; }
    codeSent = true; $("#codeBox").hidden = false; $("#bLogin").textContent = "Se connecter";
    m.style.color = "var(--soft)"; m.textContent = "Code envoyé. Regardez votre boîte Gmail."; $("#code").focus();
  } else {
    const { error } = await sb.auth.verifyOtp({ email, token: $("#code").value.trim(), type:"email" });
    if(error){ m.style.color = ""; m.textContent = "Code refusé : vérifiez-le ou redemandez-en un."; return; }
    start();
  }
};

// ---------- Chargement ----------
async function load(){
  const { data:{ user } } = await sb.auth.getUser();
  const email = (user?.email || "").toLowerCase();
  const [me, trips, shows, bks, dls, exs, pk] = await Promise.all([
    sb.from("people").select("id,name").eq("email", email).maybeSingle(),
    sb.from("perso_trips").select("*").order("start_date"),
    sb.from("shows").select("id,name,location,start_date,end_date,entries_close").order("start_date"),
    sb.from("perso_bookings").select("*"),
    sb.from("perso_deadlines").select("*"),
    sb.from("perso_expenses").select("*").order("spent_on", {ascending:false}),
    sb.from("perso_packing").select("*"),
    loadVault()
  ]);
    for(const r of [trips, bks, dls, exs]) if(r.error) throw new Error("perso: " + r.error.message);
  if(shows.error) throw new Error("shows: " + shows.error.message);
  const meId = me.data?.id;
  let entries = [], horses = [], classes = [];
  if(meId){
    const e = await sb.from("entries").select("id,show_id,horse_id,owner_id,shown_by,classes,class_ids")
      .or(`owner_id.eq.${meId},shown_by.eq.${meId}`);
    entries = e.data || [];
    const hIds = [...new Set(entries.map(x => x.horse_id))];
    const cIds = [...new Set(entries.flatMap(x => x.class_ids || []))];
    const [h, c] = await Promise.all([
      hIds.length ? sb.from("horses").select("id,barn_name,registered_name").in("id", hIds) : {data:[]},
      cIds.length ? sb.from("show_classes").select("id,show_id,class_no,name,class_date,start_time,time_note,arena,sort_order").in("id", cIds) : {data:[]}
    ]);
    horses = h.data || []; classes = c.data || [];
  }
  D = { meId, trips: trips.data, shows: shows.data, entries,
        bookings: bks.data, deadlines: dls.data, expenses: exs.data, packing: pk.data || [],
        trip: Object.fromEntries(trips.data.map(t => [t.id, t])),
        horse: Object.fromEntries(horses.map(h => [h.id, h])),
        cls: Object.fromEntries(classes.map(c => [c.id, c])),
        show: Object.fromEntries(shows.data.map(s => [s.id, s])) };
}

// ---------- Blocs communs ----------
function horseBlock(e, meId, onlyFrom){
  const h = D.horse[e.horse_id] || {};
  const role = e.shown_by === meId ? "je monte" : "monté par Torey ou son équipe";
  const sched = (e.class_ids || []).map(id => D.cls[id]).filter(Boolean)
    .filter(c => !onlyFrom || !c.class_date || c.class_date >= onlyFrom)
    .sort((a,b) => (a.class_date||"").localeCompare(b.class_date||"") || (a.sort_order??0)-(b.sort_order??0));
  const byDay = {};
  sched.forEach(c => (byDay[c.class_date || "—"] ||= []).push(c));
  const days = Object.entries(byDay).map(([d, cs]) => `
    <dl class="day"><dt>${d === "—" ? "Date à venir" : esc(fmtDay(d))}</dt><dd>${cs.map(c =>
      `<div>${c.class_no ? `<b>${esc(c.class_no)}</b> ` : ""}${esc(c.name)}${c.start_time ? ` <span class="muted">${esc(c.start_time.slice(0,5))}</span>` : ""}${c.arena ? ` <span class="muted">${esc(c.arena)}</span>` : ""}</div>`).join("")}</dd></dl>`).join("");
  const rest = (e.classes || []).filter(Boolean);
  const restHtml = rest.length ? `<p class="muted">${sched.length ? "Pas encore au programme du show" : "Classes prévues (programme du show pas encore importé)"} : ${rest.map(esc).join(", ")}</p>` : "";
  return `<div class="horse"><h4>${esc(h.barn_name || "Cheval")} <span>${esc(role)}</span></h4>
    ${days || (rest.length ? "" : `<p class="muted">Aucune classe cochée pour l’instant.</p>`)}${restHtml}</div>`;
}

// ---------- Accueil ----------
function viewAccueil(){
  const t = todayISO();
  const upcoming = D.trips.filter(x => (x.end_date || x.start_date) >= t);
  const cur = upcoming[0];
  if(!cur) return `<div class="bib"><p class="when">Aucun voyage prévu</p><h2>Ajoutez votre prochain show</h2></div>` + homeExtras(t);
  const live = cur.start_date <= t;
  const n = live ? daysBetween(cur.start_date, t) + 1 : daysBetween(t, cur.start_date);
  const total = daysBetween(cur.start_date, cur.end_date) + 1;
  const when = live ? "En cours" : (n === 1 ? "Départ demain" : "Départ dans");
  const unit = live ? `jour sur ${total}` : (n === 1 ? "jour" : "jours");
  const shows = (cur.show_ids || []).map(id => D.show[id]).filter(Boolean);
  const showEntries = D.entries.filter(e => (cur.show_ids || []).includes(e.show_id));
  const closing = shows.filter(s => s.entries_close && s.entries_close >= t);

  let html = `<div class="bib" role="group" aria-label="Prochain show">
    <p class="when">${when}</p>
    <div class="num">${n}</div>
    <p class="unit">${unit}</p>
    <h2>${esc(shows.length === 1 ? shows[0].name : cur.title)}</h2>
    <p class="where">${esc(shows[0]?.location || cur.location || "")}<br>${esc(fmtRange(cur.start_date, cur.end_date))}</p>
    ${shows.length > 1 ? `<div class="shows">${shows.map(s => `<span class="chip on">${esc(s.name)}</span>`).join("")}</div>` : ""}
    ${closing.length ? `<div class="shows">${closing.map(s => `<span class="chip warn">Inscriptions avant le ${esc(fmt(s.entries_close,{day:"numeric",month:"long"}))}</span>`).join("")}</div>` : ""}
  </div>`;

  html += homeExtras(t);
  html += `<section><h3>Mes chevaux sur ce voyage</h3>`;
  html += showEntries.length
    ? shows.map(s => {
        const es = showEntries.filter(e => e.show_id === s.id);
        if(!es.length) return "";
        return (shows.length > 1 ? `<p class="muted" style="margin:0 0 8px">${esc(s.name)}</p>` : "") +
          es.map(e => horseBlock(e, D.meId, live ? t : null)).join("");
      }).join("")
    : `<p class="empty">Aucun cheval inscrit dans TRPH pour ce voyage.</p>`;
  html += `</section>`;

  const later = upcoming.slice(1, 4);
  if(later.length){
    html += `<section><h3>Ensuite</h3>${later.map(x => `<div class="next"><span>${esc(x.title)}</span><span class="d">${esc(fmtRange(x.start_date, x.end_date))}</span></div>`).join("")}</section>`;
  }
  return html;
}

// ---------- Concours ----------
const openShows = new Set();
function viewConcours(){
  const t = todayISO();
  const mine = new Set(D.entries.map(e => e.show_id));
  D.trips.forEach(x => (x.show_ids || []).forEach(id => mine.add(id)));
  const list = D.shows.filter(s => mine.has(s.id) && (s.end_date || s.start_date) >= t);
  if(!list.length) return `<p class="empty">Aucun show à venir avec vos chevaux. Les inscriptions se font dans <a class="link" href="${TRPH_URL}">TRPH</a>.</p>`;
  return `<p class="muted" style="margin-top:18px">Shows à venir où vous avez un cheval inscrit ou un voyage prévu. Les données viennent de TRPH.</p>` +
    list.map(s => {
      const es = D.entries.filter(e => e.show_id === s.id);
      const going = D.trips.some(x => (x.show_ids || []).includes(s.id));
      const open = openShows.has(s.id);
      const horses = es.map(e => D.horse[e.horse_id]?.barn_name).filter(Boolean);
      return `<article class="show">
        <button aria-expanded="${open}" data-show="${s.id}">
          <h3>${esc(s.name)}</h3>

function bkLine(b){
  const bits = [];
  if(b.kind === "vol"){
    if(b.start_time) bits.push(`${b.start_time}${b.end_time ? " → " + b.end_time : ""}${b.end_date && b.end_date !== b.start_date && b.end_time ? " (+1)" : ""}`);
    if(b.flight_no) bits.push(b.flight_no);
    if(b.seat) bits.push("siège " + b.seat);
    if(b.cabin) bits.push(b.cabin);
  } else {
    if(b.end_date && b.end_date !== b.start_date) bits.push("jusqu’au " + fmt(b.end_date,{day:"numeric",month:"short"}) + (b.end_time ? " " + b.end_time : ""));
    if(b.start_time && b.kind === "hotel") bits.push("arrivée " + b.start_time);
    if(b.cabin) bits.push(b.cabin);
  }
  if(b.reference) bits.push("réf. " + b.reference);
  return bits.join(", ");
}
// Période par défaut d'un voyage : du 1er au dernier jour où je monte une classe ; sinon dates des shows
function tripWindow(tripId){
  const x = tripOf(tripId); if(!x) return null;
  const ids = x.show_ids || [];
  const days = D.entries.filter(e => ids.includes(e.show_id) && e.shown_by === D.meId)
    .flatMap(e => (e.class_ids || []).map(c => D.cls[c]?.class_date)).filter(Boolean).sort();
  if(days.length) return { from:days[0], to:days[days.length - 1], src:"classes" };
  const sh = ids.map(i => D.show[i]).filter(Boolean);
  if(sh.length) return { from: sh.map(s => s.start_date).sort()[0], to: sh.map(s => s.end_date || s.start_date).sort().pop(), src:"show" };
  return x.start_date ? { from:x.start_date, to:x.end_date || x.start_date, src:"voyage" } : null;
}
// Logement, voiture : de l'atterrissage de l'aller au décollage du retour, si les vols sont réservés
function bookWindow(b){
  const w = tripWindow(b.trip_id); if(!w || b.kind === "vol") return w;
  const fl = D.bookings.filter(f => f.trip_id === b.trip_id && f.kind === "vol" && f.status === "ok" && f.start_date);
  const out = fl.filter(f => f.start_date <= w.from).map(f => f.end_date || f.start_date).sort().pop();
  const back = fl.filter(f => f.start_date >= w.to).map(f => f.start_date).sort()[0];
  if(!out && !back) return w;
  return { from: out || w.from, to: back || w.to, src: out && back ? "vols" : "mixte" };
}

// ---------- Étape 3 : coffre-fort chiffré ----------
const TE = new TextEncoder(), TD = new TextDecoder();
const b64 = u8 => { let s = ""; u8 = new Uint8Array(u8); for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let VKEY = null, VRAW = null, VAULT = null, VURLS = [], FIDPEND = null;
const VKIND = { passeport:"Passeport", identite:"Carte d’identité", permis:"Permis", voyage:"Voyage (ESTA, visa)", assurance:"Assurance", sante:"Santé, mutuelle", banque:"Carte bancaire", carte:"Carte de membre, fidélité", autre:"Autre" };
async function deriveRaw(pass, salt){
  const base = await crypto.subtle.importKey("raw", TE.encode(pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name:"PBKDF2", salt, iterations:310000, hash:"SHA-256" }, base, 256));
}
const importAes = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt","decrypt"]);
async function encBytes(bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, VKEY, bytes); return { iv:b64(iv), ct }; }
const decBytes = (iv, ct, key = VKEY) => crypto.subtle.decrypt({ name:"AES-GCM", iv:ub64(iv) }, key, ct);
async function loadVault(){

  const st = Object.fromEntries((s.data || []).map(r => [r.key, r.value]));
  VAULT = { conf: st.vault || null, fid: st.vault_faceid || null, docs: v.data || [] };
}
function lockVault(){ VKEY = null; VRAW = null; FIDPEND = null; VURLS.forEach(URL.revokeObjectURL); VURLS = []; if($("#dlg").open && FORM?.kind === "vault") $("#dlg").close(); }

    return `<button class="row" data-vdoc="${d.id}"><h3>${esc(d.label)}</h3><div class="meta">${esc(VKIND[d.kind] || "")}${d.files.length ? `, ${d.files.length} photo${d.files.length > 1 ? "s" : ""}` : ""}</div>
      ${chip ? `<div class="shows" style="justify-content:flex-start">${chip}</div>` : ""}</button>`;
  };
  const fidBtn = !window.PublicKeyCredential ? "" : FIDPEND ? `<button class="btn small" data-fidfinish>Confirmer avec Face ID</button>`
    : VAULT.fid ? `<button class="btn ghost small" style="margin:0" data-fidoff>Désactiver Face ID</button>` : `<button class="btn small line" data-fidon>Activer Face ID</button>`;

async function vaultCreate(){
  const a = $("#v1").value, b = $("#v2").value, m = $("#vMsg");
  if(a.length < 8) return m.textContent = "Le code doit faire au moins 8 caractères.";
  if(a !== b) return m.textContent = "Les deux codes ne sont pas identiques.";
  const salt = crypto.getRandomValues(new Uint8Array(16));
  VRAW = await deriveRaw(a, salt); VKEY = await importAes(VRAW);
  const chk = await encBytes(TE.encode("murph-coffre-ok"));
  const value = { salt:b64(salt), iv:chk.iv, check:b64(chk.ct), iterations:310000 };
  const { error } = await sb.from("perso_settings").insert({ key:"vault", value });
  if(error){ VKEY = null; return m.textContent = "Pas enregistré : " + error.message; }
  VAULT.conf = value; render(); toast("Coffre créé");
}
async function vaultUnlock(){
  const m = $("#vMsg"); m.textContent = "Vérification…";
  try{
    const c = VAULT.conf, raw = await deriveRaw($("#vp").value, ub64(c.salt)), key = await importAes(raw);
    const ok = TD.decode(await decBytes(c.iv, ub64(c.check), key));
    if(ok !== "murph-coffre-ok") throw 0;
    VKEY = key; VRAW = raw; render();
  } catch(e){ m.textContent = "Code incorrect."; }
}

// ---------- Coffre : Face ID (passkey + extension PRF) ----------
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function prfGet(credId, salt){
  const a = await navigator.credentials.get({ publicKey:{ challenge:rnd(32), allowCredentials:[{ type:"public-key", id:credId }],
    userVerification:"required", timeout:60000, extensions:{ prf:{ eval:{ first:salt } } } } });
  const r = a.getClientExtensionResults()?.prf?.results?.first;
  if(!r) throw new Error("nosupport");
  return new Uint8Array(r);
}
async function fidStore(credId, salt, secret){
  const wk = await importAes(secret), iv = rnd(12);
  const wrapped = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, wk, VRAW);
  const value = { cred:b64(credId), salt:b64(salt), iv:b64(iv), wrapped:b64(wrapped) };
  const { error } = await sb.from("perso_settings").upsert({ key:"vault_faceid", value });
  if(error) throw error;
  VAULT.fid = value; FIDPEND = null; render(); toast("Face ID activé");
}
const fidErr = e => toast(e?.message === "nosupport" ? "Face ID n’est pas disponible pour le coffre sur cet appareil (iOS 18 minimum)." : e?.name === "NotAllowedError" ? "Face ID annulé." : "Face ID : " + (e?.message || e));
async function fidEnable(){
  try{
    const salt = rnd(32);
    const cred = await navigator.credentials.create({ publicKey:{
      rp:{ name:"Murph" }, user:{ id:rnd(16), name:"Murph – coffre", displayName:"Murph – coffre" }, challenge:rnd(32),
      pubKeyCredParams:[{ type:"public-key", alg:-7 }, { type:"public-key", alg:-257 }],
      authenticatorSelection:{ authenticatorAttachment:"platform", residentKey:"required", userVerification:"required" },
      timeout:60000, extensions:{ prf:{ eval:{ first:salt } } } } });
    const prf = cred.getClientExtensionResults()?.prf;
    if(prf?.enabled === false) throw new Error("nosupport");
    const credId = new Uint8Array(cred.rawId);
    if(prf?.results?.first) return fidStore(credId, salt, new Uint8Array(prf.results.first));
    FIDPEND = { credId, salt }; render();
  } catch(e){ fidErr(e); }
}
async function fidFinish(){
  try{ const r = await prfGet(FIDPEND.credId, FIDPEND.salt); await fidStore(FIDPEND.credId, FIDPEND.salt, r); }
  catch(e){ fidErr(e); }
}
async function fidOpen(){
  try{
    const f = VAULT.fid, r = await prfGet(ub64(f.cred), ub64(f.salt));
    const raw = new Uint8Array(await crypto.subtle.decrypt({ name:"AES-GCM", iv:ub64(f.iv) }, await importAes(r), ub64(f.wrapped)));
    const key = await importAes(raw), c = VAULT.conf;
    if(TD.decode(await decBytes(c.iv, ub64(c.check), key)) !== "murph-coffre-ok") throw new Error("clé incorrecte");
    VKEY = key; VRAW = raw; render();
  } catch(e){ fidErr(e); }
}

async function shrinkImage(file){
  if(!file.type.startsWith("image/")) return file;
  try{
    const bmp = await createImageBitmap(file), max = 2200, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", .86));
  } catch(e){ return file; }
}

// ---------- Étape 3 : valise et météo ----------
const WX = {};
const addDays = (iso, n) => { const d = toDate(iso); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const minusYear = iso => { const [y,m,d] = iso.split("-"); return `${+y - 1}-${m}-${m === "02" && d === "29" ? "28" : d}`; };
async function getWeather(x){
  if(WX[x.id]) return WX[x.id];
  if(x.lat == null || !x.start_date) return null;
  const t = todayISO(), s = x.start_date, e = x.end_date || s;
  let url, label;
  const base = `latitude=${x.lat}&longitude=${x.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`;
  if(daysBetween(t, s) <= 14 && e >= t){
    const s2 = s < t ? t : s, lim = addDays(t, 15), e2 = e > lim ? lim : e;
    url = `https://api.open-meteo.com/v1/forecast?${base}&start_date=${s2}&end_date=${e2}`; label = "Prévisions";
  } else if(e < addDays(t, -6)){
    url = `https://archive-api.open-meteo.com/v1/archive?${base}&start_date=${s}&end_date=${e}`; label = "Météo observée";
  } else {
    url = `https://archive-api.open-meteo.com/v1/archive?${base}&start_date=${minusYear(s)}&end_date=${minusYear(e)}`; label = "Météo de l’an dernier aux mêmes dates";
  }
  try{
    const r = await fetch(url); if(!r.ok) throw 0;
    const d = (await r.json()).daily, mx = d.temperature_2m_max.filter(v => v != null), mn = d.temperature_2m_min.filter(v => v != null);
    WX[x.id] = { label, tmax: Math.round(Math.max(...mx)), tmin: Math.round(Math.min(...mn)),
      avgMax: Math.round(mx.reduce((a,b) => a+b, 0) / mx.length), rainDays: d.precipitation_sum.filter(v => v >= 2).length, n: mx.length };
  } catch(e){ WX[x.id] = { error:true }; }
  return WX[x.id];
}
function wxItems(w){
  if(!w || w.error) return [];
  const it = [];
  if(w.tmin < 10) it.push("Veste chaude ou polaire");
  if(w.tmin < 3) it.push("Bonnet, écharpe et gants chauds");
  if(w.avgMax >= 27) it.push("Vêtements légers");
  if(w.tmax >= 20) it.push("Casquette, lunettes de soleil, crème solaire");
  if(w.rainDays >= 2) it.push("Imperméable et bottes de pluie");
  if(w.tmax - w.tmin >= 14) it.push("Tenues en couches (matins frais, après-midi chauds)");
  return it;
}
const wxText = w => !w ? "Indiquez une ville pour la météo dans « Modifier »." : w.error ? "Météo indisponible pour l’instant."
  : `${w.label} : de ${w.tmin} à ${w.tmax} °C (maximales autour de ${w.avgMax} °C)${w.rainDays ? `, ${w.rainDays} jour${w.rainDays > 1 ? "s" : ""} de pluie` : ", sans pluie notable"}.`;

const TABLE = { trip:"perso_trips", bk:"perso_bookings", dl:"perso_deadlines", ex:"perso_expenses", pk:"perso_packing" };
function collect(kind){
  const fd = new FormData($("#frm")), v = k => { const x = fd.get(k); return x === null || x === "" ? null : String(x).trim(); };
  if(kind === "trip") return { title:v("title"), location:v("location"), start_date:v("start_date"), end_date:v("end_date"), notes:v("notes"), show_ids: fd.getAll("show_ids"), weather_place:v("weather_place") };
  if(kind === "pk") return { category:v("category") || "Divers", label:v("label"), trip_id:v("trip_id") };
  if(kind === "bk") return Object.fromEntries(["kind","status","title","trip_id","start_date","start_time","end_date","end_time","origin","destination","flight_no","seat","provider","cabin","reference","ticket","currency","notes"].map(k => [k, v(k)]).concat([["cost", v("cost") === null ? null : Number(v("cost"))]]));
  if(kind === "dl") return { title:v("title"), due_date:v("due_date"), status:v("status"), trip_id:v("trip_id"), notes:v("notes") };
  if(kind === "ex"){
    const sp = v("split"); let my = .5, ma = .5;
    if(sp === "third"){ my = 1/3; ma = 1/3; } else if(sp === "maria"){ my = 0; ma = 1; } else if(sp === "moi"){ my = 1; ma = 0; }
    else if(sp === "custom"){ my = Math.min(100, Math.max(0, Number(v("my_pct") || 0))) / 100; ma = 1 - my; }
    const o = { label:v("label"), amount:Number(v("amount")), currency:v("currency"), paid_by:v("paid_by"), spent_on:v("spent_on") || todayISO(),
      my_share:Number(my.toFixed(8)), maria_share:Number(ma.toFixed(8)), trip_id:v("trip_id"), notes:v("notes") };
    if(FORM.id) o.settled = fd.get("settled") === "on";
    return o;
  }
}

  }
  if(ev.target.closest("[data-del]")){
    if(!confirm("Supprimer définitivement ?")) return;
    const { error } = await sb.from(TABLE[FORM.kind]).delete().eq("id", FORM.id);
    if(error){ $("#frmMsg").textContent = "Pas supprimé : " + error.message; return; }
    $("#dlg").close();
    if(FORM.kind === "trip") location.hash = "#voyages";
    refresh("Supprimé");
  }
});

// ---------- Rendu ----------
function route(){
  const h = location.hash.slice(1) || "accueil";
  if(h.startsWith("voyage-")) return { v:"voyages", id:h.slice(7) };
  return { v: ["accueil","concours","voyages","finances","coffre"].includes(h) ? h : "accueil" };
}
const TITLES = { accueil:"Accueil", concours:"Concours", voyages:"Voyages", finances:"Finances", coffre:"Coffre-fort" };
function render(){
  if(!D) return;
  const { v, id } = route();
  $("#title").textContent = TITLES[v];
  document.querySelectorAll("nav a").forEach(a => a.dataset.v === v ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  $("#main").innerHTML = v === "concours" ? viewConcours() : v === "voyages" ? (id ? viewVoyage(id) : viewVoyages()) : v === "finances" ? viewFinances() : v === "coffre" ? viewCoffre() : viewAccueil();
  if(v === "voyages" && id && tripOf(id)) fillWeather(tripOf(id));
}
$("#main").addEventListener("click", async ev => {
  const g = s => ev.target.closest(s);
  let b;
  if(b = g("button[data-show]")){ const id = b.dataset.show; openShows.has(id) ? openShows.delete(id) : openShows.add(id); render(); return; }
  if(b = g("[data-edit-bk]")) return openForm("bk", D.bookings.find(x => x.id === b.dataset.editBk));
  if(b = g("[data-edit-dl]")) return openForm("dl", D.deadlines.find(x => x.id === b.dataset.editDl));
  if(b = g("[data-edit-ex]")) return openForm("ex", D.expenses.find(x => x.id === b.dataset.editEx));
  if(b = g("[data-edit-trip]")) return openForm("trip", tripOf(b.dataset.editTrip));
  if(b = g("[data-edit-pk]")) return openForm("pk", D.packing.find(x => x.id === b.dataset.editPk));
  if(b = g("[data-pack]")){ b.disabled = true; return prepareValise(b.dataset.pack, false); }
  if(b = g("[data-wxadd]")) return prepareValise(b.dataset.wxadd, true);
  if(g("[data-vcreate]")) return vaultCreate();
  if(g("[data-vunlock]")) return vaultUnlock();
  if(g("[data-vlock]")){ lockVault(); return render(); }
  if(g("[data-vnew]")) return openVaultDoc(null);
  if(g("[data-fidopen]")) return fidOpen();
  if(g("[data-fidon]")) return fidEnable();
  if(g("[data-fidfinish]")) return fidFinish();
  if(g("[data-fidoff]")) return fidOff();
  if(b = g("[data-vdoc]")) return openVaultDoc(VAULT.docs.find(d => d.id === b.dataset.vdoc));
  if(b = g("[data-new]")){
    const tr = b.dataset.trip || (route().id ?? null);
    return openForm(b.dataset.new, null, b.dataset.new === "trip" ? {} : { trip_id: tr });
  }
  if(b = g("[data-settle]")){
    const c = b.dataset.settle;
    if(!confirm("Marquer toutes les dépenses en " + (CUR[c] || c) + " comme réglées ?")) return;
    const ids = D.expenses.filter(e => !e.settled && e.currency === c).map(e => e.id);
    const { error } = await sb.from("perso_expenses").update({ settled:true }).in("id", ids);
    if(error) return toast("Pas enregistré : " + error.message);
    refresh("Réglé");
  }
});
$("#main").addEventListener("keydown", ev => { if(ev.key === "Enter" && ev.target.id === "vp") vaultUnlock(); });
$("#main").addEventListener("change", async ev => {
  const p = ev.target.closest("input[data-pk]");
  if(p){
    const { error } = await sb.from("perso_packing").update({ packed: p.checked }).eq("id", p.dataset.pk);
    if(error){ p.checked = !p.checked; return toast("Pas enregistré : " + error.message); }
    const it = D.packing.find(x => x.id === p.dataset.pk); if(it) it.packed = p.checked;
    p.closest(".task").classList.toggle("done", p.checked); return;
  }
  const c = ev.target.closest("input[data-done]"); if(!c) return;
  const { error } = await sb.from("perso_deadlines").update({ status: c.checked ? "fait" : "afaire" }).eq("id", c.dataset.done);
  if(error){ c.checked = !c.checked; return toast("Pas enregistré : " + error.message); }
  refresh(c.checked ? "Fait" : "Remis à faire");
});
addEventListener("hashchange", () => { render(); scrollTo({top:0}); });

async function start(){
  $("#vLogin").hidden = true; $("#vApp").hidden = false;
  $("#today").textContent = fmt(todayISO(), {weekday:"long", day:"numeric", month:"long"});
  $("#main").innerHTML = `<p class="empty">Chargement…</p>`;
  try { await load(); render(); }
  catch(e){ $("#main").innerHTML = `<p class="empty">Les données ne se chargent pas (${esc(e.message)}). Vérifiez la connexion internet, puis rouvrez l’app.</p>`; }
}
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ if(VKEY){ lockVault(); if(route().v === "coffre") render(); } return; }
  if(D && !$("#dlg").open) load().then(render).catch(()=>{});
});

(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if(session) start(); else $("#vLogin").hidden = false;
})();
</script>
